# Container Nginx: serves the React build and proxies the Django API.
# It is published only on the host loopback (127.0.0.1:8080). On the server a
# host Nginx terminates HTTPS and sets X-Forwarded-Proto / X-Forwarded-For,
# which are passed through unchanged to Django here.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 6m;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_read_timeout 90s;
    }

    location /admin/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
    }

    location /static/ {
        alias /srv/static/;
        expires 7d;
    }

    # Evidence is private: it is only downloadable through the permission-checked API.
    location ^~ /media/ { return 404; }

    location /assets/ {
        try_files $uri =404;
        expires 30d;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
