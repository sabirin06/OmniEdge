services:
  db:
    image: postgres:16-alpine
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  api:
    build: ./backend
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - evidence:/app/media
      - staticfiles:/app/staticfiles
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request as u; h=os.environ['ALLOWED_HOSTS'].split(',')[0].strip(); u.urlopen(u.Request('http://127.0.0.1:8000/api/v1/health/', headers={'Host': h}), timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  nginx:
    build: ./frontend
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - staticfiles:/srv/static:ro
    depends_on:
      - api
    restart: unless-stopped

  # Optional account-email worker. Start it only after SMTP is configured in .env:
  #   docker compose --profile mail up -d mail
  mail:
    build: ./backend
    env_file: .env
    command: ["python", "manage.py", "send_account_mail", "--watch"]
    depends_on:
      db:
        condition: service_healthy
    profiles: ["mail"]
    restart: unless-stopped

volumes:
  pgdata:
  evidence:
  staticfiles:
